<div class="formulario">
  <h2>Eliminar Rol</h2>

  <p>¿Seguro que quieres eliminar el rol <strong>{{ nombre }}</strong>?</p>

  <div class="botones">
    <button class="btn-delete" (click)="eliminar()">Eliminar</button>
    <button class="btn-cancel" (click)="cancelar()">Cancelar</button>
  </div>
</div>
