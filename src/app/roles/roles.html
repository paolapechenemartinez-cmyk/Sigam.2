<div class="container">
  <h2>Roles</h2>

  <div class="role-card" *ngFor="let rol of roles">
    <p>{{ rol.nombre }}</p>
    <div class="actions">
      <button class="btn-update" (click)="actualizarRol(rol.id, rol.nombre + ' actualizado')">Actualizar</button>
      <button class="btn-delete" (click)="eliminarRol(rol.id)">Eliminar</button>
    </div>
  </div>
</div>
