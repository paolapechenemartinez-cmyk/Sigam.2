<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear nueva contraseña</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #263238;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            margin: 55px auto;
            padding: 20px;
            text-align: center;
        }

        .logo {
            width: 96px;
            height: 96px;
            background: #ff7518;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 25px auto;

            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 14px 0;

            font-size: 28px;
            font-weight: 700;
            color: #263238;
        }

        .descripcion {
            margin: 0 0 32px 0;

            font-size: 16px;
            line-height: 1.5;
            color: #777777;
        }

        form {
            width: 100%;
            text-align: left;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            color: #263238;
        }

        input {
            width: 100%;
            height: 49px;

            padding: 0 15px;

            border: 1px solid #ff7518;
            border-radius: 10px;

            outline: none;

            font-size: 16px;
            color: #263238;

            background: #ffffff;
        }

        input:focus {
            border: 2px solid #ff7518;
        }

        button {
            width: 100%;
            height: 48px;

            margin-top: 4px;

            border: none;
            border-radius: 25px;

            background: #ff7518;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #f56d10;
        }

        .errores {
            margin-bottom: 20px;

            color: red;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .contenedor {
                margin: 35px auto;
                padding: 20px;
            }

            .logo {
                width: 90px;
                height: 90px;
                font-size: 22px;
            }

            h1 {
                font-size: 25px;
            }

            .descripcion {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="logo">
            SIGAM
        </div>

        <h1>Crear nueva contraseña</h1>

        <p class="descripcion">
            Ingresa tu nueva contraseña.
        </p>

        {% if validlink %}

            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="errores">
                        Revisa los campos e intenta nuevamente.
                    </div>
                {% endif %}

                <div class="campo">
                    <label for="id_new_password1">
                        Nueva contraseña
                    </label>

                    <input
                        type="password"
                        name="new_password1"
                        id="id_new_password1"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="id_new_password2">
                        Confirmar nueva contraseña
                    </label>

                    <input
                        type="password"
                        name="new_password2"
                        id="id_new_password2"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit">
                    Cambiar contraseña
                </button>

            </form>

        {% else %}

            <p style="color: red; font-size: 16px;">
                El enlace de recuperación no es válido o ya expiró.
            </p>

            <a href="{% url 'password_reset' %}">
                Volver a recuperar contraseña
            </a>

        {% endif %}

    </div>

</body>
</html>
