<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contraseña actualizada</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            width: 390px;
            min-height: 100vh;
            padding: 50px 25px;
            text-align: center;
        }

        .icono {
            width: 95px;
            height: 95px;
            margin: 30px auto;
            border-radius: 50%;
            background: #f47b20;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
        }

        h1 {
            font-size: 25px;
            color: #333333;
        }

        p {
            color: #777777;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            background: #f47b20;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="icono">
        ✓
    </div>

    <h1>Contraseña actualizada</h1>

    <p>
        Tu contraseña ha sido cambiada correctamente.
    </p>

    <a href="/admin/login/">
        Iniciar sesión
    </a>

</div>

</body>
</html>
