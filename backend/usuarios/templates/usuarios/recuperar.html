<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #263238;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            margin: 55px auto;
            padding: 20px;
            text-align: center;
        }

        .logo {
            width: 96px;
            height: 96px;
            background: #ff7518;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 23px;
            font-weight: bold;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 15px;
        }

        .descripcion {
            color: #777;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
        }

        input[type="email"] {
            width: 100%;
            height: 49px;
            border: 1.5px solid #ff7518;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 15px;
            outline: none;
        }

        input[type="email"]:focus {
            border-color: #ff7518;
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 20px;
            border: none;
            border-radius: 25px;
            background: #ff7518;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ed6812;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="logo">
        SIGAM
    </div>

    <h1>Recuperar contraseña</h1>

    <p class="descripcion">
        Ingresa tu correo electrónico y te enviaremos un<br>
        enlace para recuperar tu contraseña.
    </p>

    <form method="post">
        {% csrf_token %}

        <label for="id_email">Correo electrónico</label>

        {{ form.email }}

        <button type="submit">
            Continuar
        </button>
    </form>

</div>

</body>
</html>
